<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BHATI LAW ASSOCIATES</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="css/login.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

<body class="login-body">

<!-- ================= BACK BUTTON ================= -->
<a href="../index.html" class="login-back-btn">← Back to Website</a>

<div class="login-wrapper">

  <!-- ================= LEFT ================= -->
  <div class="login-branding">
    <h2>BHATI LAW ASSOCIATES</h2>
    <p>Secure Legal Portal</p>
  </div>

  <!-- ================= RIGHT ================= -->
  <div class="login-form-panel">
    <div class="login-card">

      <h1>Login</h1>

      <!-- ================= TABS ================= -->
      <div class="login-tabs">
        <button onclick="switchTab('admin')" id="tab-admin" class="active">Admin</button>
        <button onclick="switchTab('client')" id="tab-client">Client</button>
      </div>

      <!-- ================= ADMIN ================= -->
      <div id="panel-admin" class="login-panel active">

        <form id="admin-login-form">
          <input type="text" id="admin-username" placeholder="Username" required>
          <input type="password" id="admin-password" placeholder="Password" required>

          <button type="submit">Login as Admin</button>
        </form>

        <div id="admin-error"></div>
      </div>

      <!-- ================= CLIENT ================= -->
      <div id="panel-client" class="login-panel" style="display:none;">

        <!-- Step 1 -->
        <div id="step-1">
          <form id="mobile-form">
            <input type="tel" id="mobile" placeholder="Enter mobile number" required>
            <div id="recaptcha-container"></div>
            <button type="submit">Send OTP</button>
          </form>
        </div>

        <!-- Step 2 -->
        <div id="step-2" style="display:none;">
          <input type="text" id="otp" placeholder="Enter OTP">
          <button onclick="verifyOTP()">Verify OTP</button>
        </div>

        <div id="client-error"></div>
      </div>

    </div>
  </div>

</div>

<script>
// ================= FIREBASE CONFIG =================
// 🔴 REPLACE THIS WITH YOUR REAL CONFIG
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};

let auth, confirmationResult, recaptchaVerifier;

// INIT FIREBASE
if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();

  recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
    size: 'invisible'
  });
} else {
  console.warn("Firebase not configured → Demo mode ON");
}

// ================= TAB SWITCH =================
function switchTab(tab) {
  document.getElementById('panel-admin').style.display = tab === 'admin' ? 'block' : 'none';
  document.getElementById('panel-client').style.display = tab === 'client' ? 'block' : 'none';

  document.getElementById('tab-admin').classList.toggle('active', tab === 'admin');
  document.getElementById('tab-client').classList.toggle('active', tab === 'client');
}

// ================= ADMIN LOGIN =================
document.getElementById('admin-login-form').addEventListener('submit', function(e){
  e.preventDefault();

  const user = document.getElementById('admin-username').value;
  const pass = document.getElementById('admin-password').value;

  if(user === "admin" && pass === "bhati@2024"){
    localStorage.setItem("authToken", "admin");
    window.location.href = "../admin/dashboard.html";
  } else {
    document.getElementById('admin-error').innerText = "Invalid credentials";
  }
});

// ================= SEND OTP =================
document.getElementById('mobile-form').addEventListener('submit', async function(e){
  e.preventDefault();

  const mobile = document.getElementById('mobile').value;

  if(!/^[6-9]\d{9}$/.test(mobile)){
    document.getElementById('client-error').innerText = "Invalid mobile number";
    return;
  }

  if(auth){
    try {
      confirmationResult = await auth.signInWithPhoneNumber("+91" + mobile, recaptchaVerifier);
      document.getElementById('step-1').style.display = "none";
      document.getElementById('step-2').style.display = "block";
    } catch(err){
      document.getElementById('client-error').innerText = err.message;
    }
  } else {
    // DEMO MODE
    alert("Demo OTP: 123456");
    window.demoOTP = "123456";
    document.getElementById('step-1').style.display = "none";
    document.getElementById('step-2').style.display = "block";
  }
});

// ================= VERIFY OTP =================
async function verifyOTP(){
  const otp = document.getElementById('otp').value;

  if(auth){
    try {
      await confirmationResult.confirm(otp);
      localStorage.setItem("authToken", "client");
      window.location.href = "../index.html";
    } catch {
      document.getElementById('client-error').innerText = "Invalid OTP";
    }
  } else {
    if(otp === "123456"){
      localStorage.setItem("authToken", "client");
      window.location.href = "../index.html";
    } else {
      document.getElementById('client-error').innerText = "Wrong OTP (use 123456)";
    }
  }
}
</script>

</body>
</html>
